name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact stable version to validate in a dry-run rehearsal'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  # agent-tool-platform workflow pin: d3415dd9a7b825ff15fb869236cffbc5ffce5d65
  release:
    permissions:
      contents: write
      id-token: write
    uses: ashergarland/agent-tool-platform/.github/workflows/capability-release.yml@d3415dd9a7b825ff15fb869236cffbc5ffce5d65
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}
      recover_github_release: false
