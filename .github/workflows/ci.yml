name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run openapi:emit
      - run: npm run metadata:validate
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  container:
    runs-on: ubuntu-latest
    env:
      IMAGE: agent-tool-server-ast-summarizer:test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: agent-tool-server-ast-summarizer:test

      # Generated per run so no credential literal, however synthetic, lives in the repository.
      - name: Generate an ephemeral API key
        run: echo "API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Create a tiny read-only fixture workspace
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fixture/src"
          printf 'export interface User { id: string }\n' > "$RUNNER_TEMP/fixture/src/types.ts"
          printf "import type { User } from './types.js';\nexport function createUser(id: string): User { return { id }; }\n" \
            > "$RUNNER_TEMP/fixture/src/main.ts"
          chmod -R a+rX "$RUNNER_TEMP/fixture"

      - name: Refuse readiness and tool calls without a workspace
        run: |
          set -euo pipefail
          docker run --rm -d --name tool-server-bare -p 8081:8080 \
            -e API_KEYS="$API_KEY" "$IMAGE"
          trap 'docker logs tool-server-bare; docker stop tool-server-bare >/dev/null' EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8081/health >/dev/null && break
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/ready)" = 503
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H "x-api-key: $API_KEY" -H 'content-type: application/json' \
            -d '{"path":"src/main.ts"}' \
            http://127.0.0.1:8081/tools/get_file_skeleton)" = 503

      - name: Invoke both tools over authenticated HTTP against a read-only mount
        run: |
          set -euo pipefail
          docker run --rm -d --name tool-server -p 8080:8080 \
            --read-only --tmpfs /tmp \
            -v "$RUNNER_TEMP/fixture:/workspace:ro" \
            -e AST_WORKSPACE_ROOT=/workspace \
            -e API_KEYS="$API_KEY" "$IMAGE"
          trap 'docker logs tool-server; docker stop tool-server >/dev/null' EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/ready >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/version >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/tools)" = 401

          skeleton="$(curl --fail --silent -X POST \
            -H "x-api-key: $API_KEY" -H 'content-type: application/json' \
            -d '{"path":"src/main.ts"}' \
            http://127.0.0.1:8080/tools/get_file_skeleton)"
          echo "$skeleton" | grep -q 'export function createUser(id: string): User;'
          if echo "$skeleton" | grep -q 'return { id }'; then
            echo 'implementation leaked into the skeleton' && exit 1
          fi

          graph="$(curl --fail --silent -X POST \
            -H "x-api-key: $API_KEY" -H 'content-type: application/json' \
            -d '{"path":"src/main.ts","maxDepth":2}' \
            http://127.0.0.1:8080/tools/get_dependency_graph)"
          echo "$graph" | grep -q 'src/types.ts'

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H "x-api-key: $API_KEY" -H 'content-type: application/json' \
            -d '{"path":"../etc/passwd"}' \
            http://127.0.0.1:8080/tools/get_file_skeleton)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H "x-api-key: $API_KEY" -H 'content-type: application/json' \
            -d '{"path":"/etc/passwd"}' \
            http://127.0.0.1:8080/tools/get_file_skeleton)" = 400

      - name: Verify unprivileged execution
        run: test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" = node

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: az bicep install
      - name: Build and lint Bicep
        run: |
          az bicep build --file infra/main.bicep
          az bicep lint --file infra/main.bicep
          az bicep build-params --file infra/parameters/dev.bicepparam
